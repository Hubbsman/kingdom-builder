<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#040709"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Subtle orange glow -->
  <ellipse cx="370" cy="140" rx="190" ry="160" fill="#f97316" opacity="0.10"/>
  <!-- K letterform -->
  <text
    x="252" y="368"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="310"
    font-weight="bold"
    fill="#ffffff"
    fill-opacity="0.96"
    text-anchor="middle">K</text>
  <!-- Orange accent dot -->
  <circle cx="352" cy="152" r="30" fill="#f97316"/>
  <circle cx="352" cy="152" r="16" fill="#fbbf24" opacity="0.55"/>
</svg>
