<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#040709"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background (no rounded corners — OS applies the mask shape) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="340" cy="150" rx="170" ry="140" fill="#f97316" opacity="0.09"/>
  <!-- K — smaller to stay within maskable safe zone (central 80%) -->
  <text
    x="256" y="322"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="230"
    font-weight="bold"
    fill="#ffffff"
    fill-opacity="0.96"
    text-anchor="middle">K</text>
  <!-- Orange accent dot -->
  <circle cx="318" cy="172" r="24" fill="#f97316"/>
  <circle cx="318" cy="172" r="13" fill="#fbbf24" opacity="0.55"/>
</svg>
