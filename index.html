<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA viewport — viewport-fit=cover handles the iPhone notch/Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#040709" />
    <meta name="msapplication-TileColor" content="#040709" />

    <!-- iOS PWA behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kingdom" />

    <!-- iOS icon (used by Safari for Add to Home Screen) -->
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <title>Kingdom Builder</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #040709; }
      #root { }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
